name: Kariva CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Run Unit & Robolectric Tests
      run: ./gradlew testDebugUnitTest --stacktrace || gradle testDebugUnitTest --stacktrace

    - name: Build Debug APK
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kariva-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
